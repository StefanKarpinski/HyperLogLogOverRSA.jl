name: CI

# Run the package test suite only when something that can change a test outcome
# changes — source, tests, the dependency spec, or this workflow itself. Doc-only
# pushes (docs/**, *.md) are handled by Documentation.yml and skip these tests.
on:
  push:
    branches: [main]
    tags: ['*']
    paths:
      - 'src/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/CI.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'Project.toml'
      - '.github/workflows/CI.yml'

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['lts', '1']   # current LTS + latest release
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
